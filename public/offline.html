<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <title>TugasKu - Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        background: #f5f8ff;
        color: #1f2937;
        text-align: center;
      }
      main {
        padding: 24px;
        max-width: 320px;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 8px;
        color: #2563eb;
      }
      p {
        font-size: 16px;
        line-height: 1.5;
        margin: 0 0 24px;
      }
      button {
        background: #2563eb;
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 12px 24px;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Anda sedang offline</h1>
      <p>
        TugasKu belum bisa dibuka karena tidak ada koneksi internet. Sambungkan internet
        lalu coba lagi.
      </p>
      <button type="button" onclick="location.reload()">Coba Lagi</button>
    </main>
  </body>
</html>
